<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine 💖</title>

<style>
body{
  margin:0;
  height:100vh;
  background:black;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  font-family:Arial;
}

/* IMAGE */
#slider{
  width:240px;
  height:240px;
  border-radius:50%;
  border:4px solid pink;
  object-fit:cover;
  animation:pulse 2s infinite;
  box-shadow:0 0 40px red;
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.08);}
  100%{transform:scale(1);}
}

/* TEXT */
h1{
  color:pink;
  margin-top:15px;
  font-size:22px;
  text-align:center;
}

/* BUTTONS */
.buttons{
  margin-top:20px;
}

button{
  padding:10px 20px;
  font-size:18px;
  border:none;
  border-radius:20px;
  background:pink;
  margin:10px;
  cursor:pointer;
  box-shadow:0 0 20px red;
}

/* POPUP */
#popup{
  display:none;
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:black;
  padding:25px;
  border-radius:15px;
  border:2px solid pink;
  text-align:center;
  color:pink;
  box-shadow:0 0 40px red;
}
</style>
</head>

<body>

<img id="slider" src="img1.jpg">

<h1>Will Uhh Be My Valentine? ❤️</h1>

<div class="buttons">
  <button onclick="yesClick()">YES 💖</button>
  <button id="noBtn" onmouseover="moveNo()">NO 💔</button>
</div>

<div id="popup">
  <h2>She Said YES 💍😍</h2>
  <p>I Love You Forever ❤️</p>
</div>

<script>
// IMAGE SLIDER
const images = [
  "img1.jpg","img2.jpg","img3.jpg",
  "img4.jpg","img5.jpg","img6.jpg"
];
let i = 0;
setInterval(()=>{
  i = (i+1) % images.length;
  document.getElementById("slider").src = images[i];
},2000);

// YES BUTTON
function yesClick(){
  document.getElementById("popup").style.display="block";
}

// NO BUTTON RUN AWAY
function moveNo(){
  const btn = document.getElementById("noBtn");
  btn.style.position="absolute";
  btn.style.left = Math.random()*80 + "vw";
  btn.style.top = Math.random()*80 + "vh";
}
</script>

</body>
</html>
